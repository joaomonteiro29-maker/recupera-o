<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Exemplo de Console</title>
</head>
<body>

    <h1>Teste do Console</h1>
    <p>Pressione F12 ou clique com o botão direito e escolha "Inspecionar" para ver o console.</p>

    <script>
        // O código abaixo envia a mensagem para o console do navegador
        console.log("Olá, mundo! Esta mensagem apareceu no console.");
       
        // Você também pode exibir variáveis ou resultados de cálculos:
        let resultado = 10 + 5;
        console.log("O resultado da soma é:", resultado);
    </script>

</body>
</html>
